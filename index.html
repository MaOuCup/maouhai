
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>第3回 魔王杯｜大会概要</title>

<style>
:root {
  color-scheme: light;
  --bg: #f7f8fa;
  --white: #ffffff;
  --black: #171717;
  --gray: #6b7280;
  --red: #ef233c;
  --border: #e2e4e8;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: #f7f7f7;
  color: var(--black);
  font-family: -apple-system, BlinkMacSystemFont,
    "Segoe UI", "Noto Sans JP", sans-serif;
  line-height: 1.8;
  isolation: isolate;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background: url("./background.jpg") center / cover no-repeat;
}

a {
  color: inherit;
}

/* ===== 共通ヘッダー ===== */
/* regulations.html と同一設定 */

.site-header {
  position: relative;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-height: 90px;
  padding: 16px 6%;
  background: var(--white);
  border-bottom: 1px solid var(--border);
}

.brand {
  display: flex;
  align-items: baseline;
  gap: 10px;
  text-decoration: none;
  white-space: nowrap;
}

.brand-main {
  color: #171717;
  font-size: clamp(32px, 7vw, 48px);
  font-weight: 900;
  letter-spacing: -0.055em;
  line-height: 1;
}

.brand-sub {
  color: #ef233c;
  font-size: clamp(15px, 3.3vw, 21px);
  font-weight: 900;
  line-height: 1;
}

/* ===== 共通三本線メニュー ===== */

.menu-wrap {
  position: relative;
  flex-shrink: 0;
}

.menu {
  width: 44px;
  height: 44px;
  border: 1px solid #e5e7eb;
  border-radius: 10px;
  background: #ffffff;
  color: #171717;
  font-size: 23px;
  cursor: pointer;
}

.nav-menu {
  display: none;
  position: absolute;
  right: 0;
  top: 52px;
  min-width: 200px;
  padding: 8px;
  background: #ffffff;
  border: 1px solid #e5e7eb;
  border-radius: 14px;
  box-shadow: 0 14px 35px rgba(0,0,0,.35);
}

.nav-menu.open {
  display: block;
}

.nav-menu a {
  display: block;
  padding: 12px 14px;
  border-radius: 9px;
  color: #171717;
  text-decoration: none;
  font-size: 14px;
  font-weight: 700;
}

.nav-menu a:hover,
.nav-menu a:focus {
  background: #fef2f2;
  color: #dc2626;
  outline: none;
}

/* ===== 大会概要本文 ===== */

main {
  max-width: 720px;
  margin: 0 auto;
  padding: 30px 18px 60px;
}

.kicker {
  margin-bottom: 7px;
  color: #dc2626;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: .18em;
}

h1 {
  margin: 0 0 24px;
  font-size: 30px;
  font-weight: 900;
  line-height: 1.2;
}

.section-title {
  margin: 30px 0 10px;
  font-size: 19px;
  font-weight: 850;
}

/* ===== 白いカード ===== */

.card {
  position: relative;
  overflow: hidden;
  margin: 12px 0;
  padding: 18px;
  background: #ffffff;
  color: #171717;
  border: 1px solid #e5e7eb;
  border-top: 4px solid #b91c1c;
  border-radius: 18px;
  box-shadow: 0 8px 28px rgba(0,0,0,.08);
}

.card::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 4px;
  height: 100%;
  background: #dc2626;
}

/* ===== 大会情報 ===== */

.row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  padding: 13px 0;
  border-bottom: 1px solid #252630;
}

.row:last-child {
  border-bottom: none;
  padding-bottom: 0;
}

.label {
  color: #6b7280;
  font-size: 13px;
}

.value {
  color: #171717;
  text-align: right;
  font-size: 14px;
  font-weight: 700;
}

/* ===== 説明文 ===== */

.notice {
  margin: 0;
  color: #6b7280;
  font-size: 13px;
  line-height: 1.8;
}

/* ===== レギュレーションリンク ===== */

.card a,
.card a:visited {
  color: #dc2626;
  background: #fef2f2;
  border: 1px solid #fecaca;
  text-decoration: underline;
  text-underline-offset: 3px;
}

.card a:hover,
.card a:focus {
  color: #b91c1c;
  background: #fee2e2;
}

/* ===== スマートフォン対応 ===== */

@media (max-width: 480px) {
  .site-header {
    min-height: 78px;
    padding: 12px 16px;
  }

  .brand-main {
    font-size: 32px;
  }

  .brand-sub {
    font-size: 15px;
  }
}
</style>
</head>

<body>

<!-- ===== 共通ヘッダー ===== -->

<header class="site-header">

  <a
    class="brand"
    href="index.html"
    aria-label="魔王杯 大会概要へ">
    <span class="brand-main">MOC</span>
    <span class="brand-sub">魔王杯</span>
  </a>

  <div class="menu-wrap">

    <button
      class="menu"
      id="menuButton"
      type="button"
      aria-label="メニュー"
      aria-expanded="false"
      aria-controls="navMenu">☰</button>

    <nav
      class="nav-menu"
      id="navMenu"
      aria-label="サイトメニュー">

      <a href="index.html">大会概要</a>
      <a href="regulations.html">魔王杯 レギュレーション</a>
      <a href="contributors">大会協力</a>
      <a href="champions.html">歴代優勝チーム</a>
      <a href="results.html">魔王杯　歴代ベスト16</a>
      <a href="rating.html">M Rating</a>

    </nav>

  </div>

</header>

<!-- ===== 大会概要 ===== -->

<main>

  <div class="kicker">MAOUHAI</div>

  <h1>第3回 魔王杯</h1>

  <!-- 大会基本情報 -->

  <div class="card">

    <div class="row">
      <span class="label">大会名</span>
      <span class="value">第3回 魔王杯</span>
    </div>

    <div class="row">
      <span class="label">開催日</span>
      <span class="value">未定</span>
    </div>

    <div class="row">
      <span class="label">開催時間</span>
      <span class="value">未定</span>
    </div>

    <div class="row">
      <span class="label">試合形式</span>
      <span class="value">未定</span>
    </div>

  </div>

  <!-- 大会形式 -->

  <h2 class="section-title">大会形式</h2>

  <div class="card">
    <p class="notice">
      詳細な対戦ルールや試合設定については、
      <a href="regulations.html">魔王杯 レギュレーションページ</a>に掲載します。
    </p>
  </div>

  <!-- 賞金 -->

  <h2 class="section-title">賞金</h2>

  <div class="card">

    <div class="row">
      <span class="label">総額</span>
      <span class="value">未定</span>
    </div>

    <div class="row">
      <span class="label">お渡し方法</span>
      <span class="value">PayPay</span>
    </div>

  </div>

  <!-- 参加について -->

  <h2 class="section-title">参加について</h2>

  <div class="card">
    <p class="notice">
      参加条件：LINEオープンチャットを利用できること。
    </p>
  </div>

  <!-- 注意事項 -->

  <h2 class="section-title">注意事項</h2>

  <div class="card">
    <p class="notice">
      大会参加前に
      <a href="regulations.html">レギュレーション</a>
      を必ず確認してください。
    </p>
  </div>

</main>

<!-- ===== メニュー開閉 ===== -->

<script>
const menuButton = document.getElementById('menuButton');
const navMenu = document.getElementById('navMenu');

menuButton.addEventListener('click', () => {
  const isOpen = navMenu.classList.toggle('open');
  menuButton.setAttribute('aria-expanded', String(isOpen));
});

document.addEventListener('click', (e) => {
  if (!e.target.closest('.menu-wrap')) {
    navMenu.classList.remove('open');
    menuButton.setAttribute('aria-expanded', 'false');
  }
});
</script>

</body>
</html>
