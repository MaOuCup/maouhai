<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>歴代優勝チーム｜魔王杯</title>

<style>
*{
  box-sizing:border-box;
}

:root{
  color-scheme:light;
}

body{
  margin:0;
  background:#f8f7f4;
  color:#292724;
  font-family:-apple-system,BlinkMacSystemFont,
    "Segoe UI","Noto Sans JP",sans-serif;
  line-height:1.7;
}

header{
  padding:18px 20px;
  background:#fff;
  border-bottom:1px solid #d8c9aa;
}

header a{
  color:#8b3038;
  font-size:20px;
  font-weight:800;
  text-decoration:none;
}

main{
  max-width:800px;
  margin:auto;
  padding:28px 16px 64px;
}

.back{
  display:inline-block;
  margin-bottom:24px;
  color:#746f66;
  font-size:14px;
  text-decoration:none;
}

.kicker{
  margin:0 0 8px;
  color:#8b3038;
  font-size:12px;
  font-weight:800;
  letter-spacing:.16em;
}

h1{
  margin:0 0 30px;
  font-size:clamp(26px,6vw,36px);
  line-height:1.4;
}

.champion{
  margin:0 0 24px;
  padding:28px 24px;
  background:#fff;
  border:1px solid #d8c9aa;
  border-top:3px solid #a88b50;
  border-radius:14px;
  box-shadow:0 4px 18px rgba(65,49,25,.04);
}

.edition{
  margin:0 0 20px;
  color:#806a3c;
  font-size:17px;
  font-weight:700;
}

.label{
  margin:0 0 6px;
  color:#8b3038;
  font-size:13px;
  font-weight:800;
  letter-spacing:.12em;
}

.team{
  margin:0;
  font-size:clamp(24px,6vw,32px);
  line-height:1.5;
  overflow-wrap:anywhere;
}

.results{
  display:inline-flex;
  align-items:center;
  min-height:44px;
  margin-top:4px;
  padding:8px 0;
  color:#8b3038;
  font-size:14px;
  font-weight:700;
  text-underline-offset:4px;
}

a:hover{
  text-decoration:underline;
}

a:focus-visible{
  outline:2px solid #8b3038;
  outline-offset:4px;
}

@media(max-width:480px){
  .champion{
    padding:24px 20px;
  }

  .edition{
    font-size:16px;
  }
}
</style>
</head>

<body>

<header>
  <a href="index.html">魔王杯</a>
</header>

<main>

<a class="back" href="index.html">← 大会概要に戻る</a>

<p class="kicker">CHAMPIONS</p>
<h1>歴代優勝チーム</h1>

<section class="champion" aria-labelledby="champion-2">
  <p class="edition">第2回 魔王杯</p>
  <h2 class="team" id="champion-2">皇族</h2>
  <p style="margin:10px 0 0;color:#292724;font-size:14px;font-weight:700;">
  FROM：まったり王国
</p>
</section>

<section class="champion" aria-labelledby="champion-1">
  <p class="edition">第1回 魔王杯</p>
  <h2 class="team" id="champion-1">カナダクオリティ</h2>
  <p style="margin:10px 0 0;color:#292724;font-size:14px;font-weight:700;">
  FROM：まったり王国
</p>
</section>

<a class="results" href="results.html">
  すべての大会成績を見る →
</a>

</main>
</body>
</html>
