
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>S Rating｜魔王杯</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  color-scheme: light;
  --bg: #f5f6f8;
  --white: #ffffff;
  --black: #171717;
  --gray: #6b7280;
  --red: #ef233c;
  --line: #e2e4e8;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--black);
  font-family: -apple-system, BlinkMacSystemFont,
    "Segoe UI", "Noto Sans JP", sans-serif;
  line-height: 1.8;
}

a {
  color: inherit;
}

/* ===== 共通ヘッダー ===== */

.site-header {
  position: relative;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-height: 90px;
  padding: 16px 6%;
  background: var(--white);
  border-bottom: 1px solid var(--line);
}

.brand {
  display: flex;
  align-items: baseline;
  gap: 10px;
  text-decoration: none;
  white-space: nowrap;
}

.brand-main {
  color: #171717;
  font-size: clamp(32px, 7vw, 48px);
  font-weight: 900;
  letter-spacing: -0.055em;
  line-height: 1;
}

.brand-sub {
  color: #ef233c;
  font-size: clamp(15px, 3.3vw, 21px);
  font-weight: 900;
  line-height: 1;
}

/* ===== 三本線メニュー ===== */

.menu-wrap {
  position: relative;
  flex-shrink: 0;
}

.menu {
  width: 44px;
  height: 44px;
  border: 1px solid #e5e7eb;
  border-radius: 10px;
  background: #ffffff;
  color: #171717;
  font-size: 23px;
  cursor: pointer;
}

.nav-menu {
  display: none;
  position: absolute;
  right: 0;
  top: 52px;
  min-width: 200px;
  padding: 8px;
  background: #ffffff;
  border: 1px solid #e5e7eb;
  border-radius: 14px;
  box-shadow: 0 14px 35px rgba(0,0,0,.35);
}

.nav-menu.open {
  display: block;
}

.nav-menu a {
  display: block;
  padding: 12px 14px;
  border-radius: 9px;
  color: #171717;
  text-decoration: none;
  font-size: 14px;
  font-weight: 700;
}

.nav-menu a:hover,
.nav-menu a:focus {
  background: #fef2f2;
  color: #dc2626;
  outline: none;
}

/* ===== メインコンテンツ ===== */

main {
  width: 100%;
  max-width: 850px;
  margin: 0 auto;
  padding: 48px 20px 80px;
}

.kicker {
  margin: 0 0 10px;
  color: var(--red);
  font-size: 13px;
  font-weight: 850;
  letter-spacing: .22em;
}

h1 {
  margin: 0 0 16px;
  font-size: clamp(30px, 6vw, 44px);
  font-weight: 850;
  line-height: 1.4;
}

.lead {
  margin: 0 0 42px;
  color: var(--gray);
  font-size: 14px;
}

/* ===== 説明カード ===== */

.card {
  position: relative;
  overflow: hidden;
  margin-bottom: 32px;
  padding: 26px 26px 26px 32px;
  background: var(--white);
  border: 1px solid var(--line);
  border-top: 4px solid #b91c1c;
  border-radius: 20px;
  box-shadow: 0 8px 28px rgba(0,0,0,.07);
}

.card::before {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  left: 0;
  width: 5px;
  background: var(--red);
}

.notice {
  margin: 0;
  color: #3f4650;
  font-size: 15px;
  font-weight: 600;
  line-height: 1.8;
}

/* ===== ランク表 ===== */

.table-card {
  position: relative;
  overflow: hidden;
  background: var(--white);
  border: 1px solid var(--line);
  border-top: 4px solid #b91c1c;
  border-radius: 20px;
  box-shadow: 0 8px 28px rgba(0,0,0,.07);
}

.table-card::before {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  left: 0;
  width: 5px;
  background: var(--red);
  z-index: 1;
}

.table-wrap {
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  background: var(--white);
}

th, td {
  padding: 17px 10px;
  text-align: center;
  border-bottom: 1px solid var(--line);
  white-space: nowrap;
}

th {
  background: #fafafa;
  color: var(--gray);
  font-size: 14px;
  font-weight: 750;
}

td {
  color: var(--black);
  font-size: 15px;
}

tbody tr:last-child td {
  border-bottom: none;
}

.rank {
  color: var(--black);
  font-size: 17px;
  font-weight: 850;
}

/* XランクはM Ratingと同じ濃い赤 */

.rank.rank-x {
  color: #a00018;
  font-size: 21px;
  font-weight: 900;
}

/* ===== フッター ===== */

.footer-note {
  margin: 48px 0 0;
  padding-top: 22px;
  border-top: 1px solid var(--line);
  color: var(--gray);
  font-size: 12px;
  text-align: center;
}

a:focus-visible,
button:focus-visible {
  outline: 2px solid var(--red);
  outline-offset: 4px;
}

/* ===== スマートフォン対応 ===== */

@media (max-width: 480px) {
  .site-header {
    min-height: 78px;
    padding: 12px 16px;
  }

  .brand-main {
    font-size: 32px;
  }

  .brand-sub {
    font-size: 15px;
  }

  main {
    padding: 36px 16px 64px;
  }

  .card {
    padding: 22px 20px 22px 26px;
    border-radius: 18px;
  }

  .notice {
    font-size: 14px;
  }

  th, td {
    padding: 15px 8px;
    font-size: 13px;
  }

  .rank {
    font-size: 16px;
  }

  .rank.rank-x {
    font-size: 20px;
  }
}
</style>
</head>

<body>

<!-- ===== 共通ヘッダー ===== -->

<header class="site-header">

  <a class="brand" href="index.html"
     aria-label="魔王杯 大会概要へ">
    <span class="brand-main">MOC</span>
    <span class="brand-sub">魔王杯</span>
  </a>

  <div class="menu-wrap">

    <button
      class="menu"
      id="menuButton"
      type="button"
      aria-label="メニュー"
      aria-expanded="false"
      aria-controls="navMenu">☰</button>

    <nav
      class="nav-menu"
      id="navMenu"
      aria-label="サイトメニュー">

      <a href="index.html">大会概要</a>
      <a href="regulations.html">レギュレーション</a>
      <a href="contributors">大会協力</a>
      <a href="champions.html">歴代優勝チーム</a>
      <a href="results.html">魔王杯　歴代ベスト16</a>
      <a href="rating.html">M Rating</a>
      <a href="s-rating.html">S Rating</a>

    </nav>

  </div>

</header>

<!-- ===== S Rating ===== -->

<main>

  <p class="kicker">S RATING</p>

  <h1>S Rating</h1>

  <p class="lead">
    魔王杯 SOLO独自のレーティング指標。
  </p>

  <!-- ===== 説明 ===== -->

  <section class="card">
    <p class="notice">
      魔王杯 SOLO独自の算出方法に基づく評価指標。
    </p>
  </section>

  <!-- ===== ランク一覧 ===== -->

  <section class="table-card" aria-label="S Rating ランク一覧">

    <div class="table-wrap">

      <table>
        <thead>
          <tr>
            <th scope="col">Rank</th>
            <th scope="col">Point</th>
          </tr>
        </thead>

        <tbody>

          <tr>
            <td class="rank rank-x">X</td>
            <td>105.00以上</td>
          </tr>

          <tr>
            <td class="rank">S+</td>
            <td>102.50〜104.99</td>
          </tr>

          <tr>
            <td class="rank">S−</td>
            <td>100.00〜102.49</td>
          </tr>

          <tr>
            <td class="rank">A+</td>
            <td>90.00〜99.99</td>
          </tr>

          <tr>
            <td class="rank">A−</td>
            <td>80.00〜89.99</td>
          </tr>

          <tr>
            <td class="rank">B+</td>
            <td>65.00〜79.99</td>
          </tr>

          <tr>
            <td class="rank">B−</td>
            <td>55.00〜64.99</td>
          </tr>

          <tr>
            <td class="rank">C</td>
            <td>40.00〜54.99</td>
          </tr>

          <tr>
            <td class="rank">D</td>
            <td>39.99以下</td>
          </tr>

        </tbody>
      </table>

    </div>

  </section>

  <p class="footer-note">
    魔王杯 S Rating
  </p>

</main>

<!-- ===== メニュー開閉 ===== -->

<script>
(function () {
  const menuButton = document.getElementById('menuButton');
  const navMenu = document.getElementById('navMenu');

  menuButton.addEventListener('click', () => {
    const isOpen = navMenu.classList.toggle('open');
    menuButton.setAttribute('aria-expanded', String(isOpen));
  });

  document.addEventListener('click', (e) => {
    if (!e.target.closest('.menu-wrap')) {
      navMenu.classList.remove('open');
      menuButton.setAttribute('aria-expanded', 'false');
    }
  });
})();
</script>

</body>
</html>
