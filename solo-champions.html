
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#21152F">

<title>魔王杯 SOLO 歴代優勝者｜MOC</title>

<style>
:root {
  color-scheme: light;
  --ink: #21152F;
  --muted: #686266;
  --purple: #4B0F99;
  --purple-dark: #35106F;
  --dark: #21152F;
  --gold: #A58A52;
  --line: #e5e0da;
  --paper: #faf9fc;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--paper);
  color: var(--ink);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
  isolation: isolate;
}

/* ===== SOLO専用背景 ===== */

body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;

  background:
    linear-gradient(
      135deg,
      #21152F 0%,
      #21152F 4%,
      #4B0F99 4%,
      #4B0F99 8%,
      #A58A52 8%,
      #A58A52 8.3%,
      transparent 8.3%
    ),
    linear-gradient(
      315deg,
      #21152F 0%,
      #21152F 4%,
      #4B0F99 4%,
      #4B0F99 9%,
      #A58A52 9%,
      #A58A52 9.3%,
      transparent 9.3%
    ),
    #faf9fc;
}

a {
  color: inherit;
}

a:focus-visible,
button:focus-visible {
  outline: 3px solid var(--gold);
  outline-offset: 4px;
}

/* ===== ヘッダー ===== */

header {
  background: var(--dark);
  color: #ffffff;
  border-bottom: 2px solid var(--gold);
}

.header-inner {
  max-width: 1040px;
  margin: 0 auto;
  padding: 22px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}

.brand {
  display: inline-flex;
  align-items: baseline;
  gap: 12px;
  text-decoration: none;
}

.brand-mark {
  color: #ffffff;
  font-size: 30px;
  font-weight: 900;
  letter-spacing: -1px;
  line-height: 1;
}

.brand-name {
  color: #ffffff;
  font-size: 15px;
  font-weight: 800;
  letter-spacing: 2px;
}

.header-label {
  color: #d8c6f1;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 2px;
}

/* ===== 三本線メニュー ===== */

.menu-wrap {
  position: relative;
  flex-shrink: 0;
}

.menu {
  width: 44px;
  height: 44px;
  border: 1px solid #e5e7eb;
  border-radius: 10px;
  background: #ffffff;
  color: #171717;
  font-size: 23px;
  cursor: pointer;
}

.nav-menu {
  display: none;
  position: absolute;
  right: 0;
  top: 52px;
  min-width: 200px;
  padding: 8px;
  background: #ffffff;
  border: 1px solid #e5e7eb;
  border-radius: 14px;
  box-shadow: 0 14px 35px rgba(0,0,0,.35);
  z-index: 100;
}

.nav-menu.open {
  display: block;
}

.nav-menu a {
  display: block;
  padding: 12px 14px;
  border-radius: 9px;
  color: #171717;
  text-decoration: none;
  font-size: 14px;
  font-weight: 700;
  white-space: nowrap;
}

.nav-menu a:hover,
.nav-menu a:focus {
  background: #f3ecff;
  color: var(--purple);
  outline: none;
}

/* ===== メイン ===== */

main {
  width: 100%;
  max-width: 900px;
  margin: 0 auto;
  padding: 32px 24px 80px;
}

.back {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  background: var(--paper);
  color: #514b4e;
  text-decoration: none;
  font-size: 13px;
  font-weight: 600;
}

.back:hover {
  color: var(--purple);
}

/* ===== ページ見出し ===== */

.page-heading {
  margin: 34px 0 40px;
  padding: 26px 0 28px;
  background: var(--paper);
  border-bottom: 1px solid #cfc5d9;
}

.eyebrow {
  margin: 0 0 12px;
  color: var(--purple);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 4px;
}

h1 {
  margin: 0;
  color: var(--purple);
  font-size: clamp(27px, 5.8vw, 44px);
  font-weight: 900;
  letter-spacing: .025em;
  line-height: 1.4;
}

.heading-note {
  margin: 15px 0 0;
  color: var(--muted);
  font-size: 13px;
}

/* ===== 優勝者カード ===== */

.champions {
  display: grid;
  gap: 30px;
}

.champion-card {
  position: relative;
  overflow: hidden;
  background: #fffdfa;
  border: 1px solid #bba7d6;
  border-radius: 3px;

  box-shadow:
    0 18px 40px rgba(30,18,45,.13),
    0 3px 8px rgba(30,18,45,.06);
}

/* ===== 大会名の帯 ===== */

.card-top {
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 17px 24px;

  background: linear-gradient(
    115deg,
    #21152F 0%,
    #21152F 65%,
    #35106F 65%,
    #4B0F99 100%
  );

  color: #ffffff;
  border-bottom: 2px solid var(--gold);
}

.edition {
  margin: 0;
  color: #ffffff;
  font-size: 15px;
  font-weight: 800;
  letter-spacing: .04em;
}

.edition-number {
  color: #e6d5ff;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 2px;
}

/* ===== カード内部 ===== */

.card-body {
  position: relative;
  isolation: isolate;
  padding: 34px 32px 48px;

  background: linear-gradient(
    135deg,
    #ffffff 0%,
    #fdfaff 55%,
    #f0e9f8 100%
  );
}

/* 右上装飾 */

.card-body::before {
  content: "";
  position: absolute;
  top: 0;
  right: 0;
  width: 100px;
  height: 100px;
  z-index: -1;
  pointer-events: none;

  background: linear-gradient(
    225deg,
    #e7d9f5 0%,
    #f3ecfb 27%,
    #A58A52 27%,
    #A58A52 28%,
    transparent 28%
  );
}

/* 右下装飾 */

.card-body::after {
  content: "";
  position: absolute;
  right: 0;
  bottom: 0;
  width: 88px;
  height: 72px;
  z-index: -1;
  pointer-events: none;

  background: linear-gradient(
    315deg,
    #21152F 0%,
    #21152F 17%,
    #35106F 17%,
    #35106F 29%,
    #A58A52 29%,
    #A58A52 31%,
    transparent 31%
  );
}

/* ===== 優勝表示 ===== */

.winner {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 0 0 16px;
  color: var(--purple);
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 3px;
}

.winner::before {
  content: "";
  width: 24px;
  height: 2px;
  background: var(--gold);
}

.player-name {
  position: relative;
  margin: 0 0 28px;
  color: var(--ink);
  font-size: clamp(26px, 5.6vw, 39px);
  font-weight: 900;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

/* ===== 詳細情報 ===== */

.details {
  margin: 0;
}

.detail-row {
  display: grid;
  grid-template-columns: 110px minmax(0,1fr);
  align-items: baseline;
  gap: 16px;
  padding: 18px 0;
  border-top: 1px solid #ded5e8;
}

.detail-row:last-child {
  padding-bottom: 0;
}

dt {
  color: var(--muted);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
}

dd {
  margin: 0;
  color: var(--ink);
  font-size: 16px;
  font-weight: 800;
  overflow-wrap: anywhere;
}

/* ===== 結果ページリンク ===== */

.results-link {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-top: 36px;
  padding: 20px 24px;
  background: #ffffff;
  border: 1px solid #bba7d6;
  color: var(--ink);
  text-decoration: none;
  font-size: 14px;
  font-weight: 700;
  transition: border-color .2s, background-color .2s;
}

.results-link:hover {
  background: #f3ecff;
  border-color: var(--purple);
}

.link-arrow {
  color: var(--purple);
  font-size: 22px;
}

/* ===== フッター ===== */

footer {
  padding: 28px 20px;
  background: var(--dark);
  color: #d8c6f1;
  border-top: 1px solid var(--purple-dark);
  text-align: center;
  font-size: 11px;
  letter-spacing: .08em;
}

footer p {
  margin: 0;
}

/* ===== スマートフォン ===== */

@media (max-width: 480px) {
  .header-inner {
    padding: 20px;
  }

  .header-label {
    display: none;
  }

  main {
    padding: 24px 16px 56px;
  }

  .page-heading {
    margin: 22px 0 28px;
    padding: 22px 0 24px;
  }

  .card-top {
    padding: 14px 20px;
  }

  .card-body {
    padding: 28px 22px 44px;
  }

  .player-name {
    margin-bottom: 24px;
  }

  .detail-row {
    grid-template-columns: 1fr;
    gap: 5px;
    padding: 15px 0;
  }

  .results-link {
    padding: 17px 20px;
  }
}

@media (prefers-reduced-motion: reduce) {
  .results-link {
    transition: none;
  }
}
</style>
</head>

<body>

<!-- ===== ヘッダー ===== -->

<header>
  <div class="header-inner">

    <a class="brand"
       href="index.html"
       aria-label="魔王杯 トップページ">
      <span class="brand-mark">MOC</span>
      <span class="brand-name">SOLO</span>
    </a>

    <span class="header-label">
      SOLO CHAMPIONS ARCHIVE
    </span>

    <div class="menu-wrap">

      <button
        class="menu"
        id="menuButton"
        type="button"
        aria-label="メニュー"
        aria-expanded="false"
        aria-controls="navMenu">☰</button>

      <nav
        class="nav-menu"
        id="navMenu"
        aria-label="サイトメニュー">

        <a href="index.html">大会概要</a>
        <a href="regulations.html">レギュレーション</a>
        <a href="contributors">大会協力</a>
        <a href="champions.html">魔王杯 歴代優勝チーム</a>
        <a href="results.html">魔王杯 歴代TOP4</a>
        <a href="solo-champions.html">魔王杯 SOLO 歴代優勝者</a>
        <a href="solo-results.html">魔王杯 SOLO 歴代TOP4</a>
        <a href="rating.html">M Rating</a>
        <a href="s-rating.html">S Rating</a>

      </nav>
    </div>
  </div>
</header>

<!-- ===== メイン ===== -->

<main>

  <a class="back" href="index.html">
    <span aria-hidden="true">←</span>
    大会概要に戻る
  </a>

  <div class="page-heading">
    <p class="eyebrow">SOLO CHAMPIONS</p>

    <h1>魔王杯 SOLO 歴代優勝者</h1>

    <p class="heading-note">
      魔王杯 SOLOの歴代優勝者を掲載しています。
    </p>
  </div>

  <div class="champions">

    <!-- ===== 第1回 魔王杯 SOLO ===== -->

    <article
      class="champion-card"
      aria-labelledby="champion-1">

      <div class="card-top">
        <p class="edition">
          第1回 魔王杯 SOLO
        </p>

        <span
          class="edition-number"
          aria-hidden="true">01</span>
      </div>

      <div class="card-body">

        <p class="winner">優勝</p>

        <h2
          class="player-name"
          id="champion-1">がかり</h2>

        <dl class="details">

          <div class="detail-row">
            <dt>FROM</dt>
            <dd>【ブロスタ交流隊】</dd>
          </div>

          <div class="detail-row">
            <dt>出場選手数</dt>
            <dd>22名</dd>
          </div>

        </dl>

      </div>
    </article>

  </div>

  <!-- ===== 大会結果ページ ===== -->

  <a
    class="results-link"
    href="solo-results.html">

    <span>魔王杯 SOLO 歴代TOP4を見る</span>

    <span
      class="link-arrow"
      aria-hidden="true">→</span>

  </a>

</main>

<!-- ===== フッター ===== -->

<footer>
  <p>魔王杯 SOLO</p>
</footer>

<!-- ===== メニュー開閉 ===== -->

<script>
(function () {
  const menuButton =
    document.getElementById('menuButton');

  const navMenu =
    document.getElementById('navMenu');

  menuButton.addEventListener('click', () => {
    const isOpen =
      navMenu.classList.toggle('open');

    menuButton.setAttribute(
      'aria-expanded',
      String(isOpen)
    );
  });

  document.addEventListener('click', (e) => {
    if (!e.target.closest('.menu-wrap')) {
      navMenu.classList.remove('open');

      menuButton.setAttribute(
        'aria-expanded',
        'false'
      );
    }
  });
})();
</script>

</body>
</html>
